<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Maya VapeShop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <header class="header">
            <div class="logo">💨 Maya VapeShop</div>
            <p class="subtitle">Выбери что-то из ассортимента</p>
        </header>

        <div id="catalog" class="catalog"></div>

        <div class="cart-panel" id="cartPanel">
            <div class="cart-panel__header" id="cartToggle">
                <span>🛒 Корзина</span>
                <span class="cart-badge" id="cartCount">0</span>
            </div>
            <div class="cart-panel__body hidden" id="cartBody">
                <div id="cartItems" class="cart-items"></div>
                <div class="cart-summary">
                    <span class="total-label">Итого:</span>
                    <span class="total-price" id="cartTotal">0 ₽</span>
                </div>
                <div class="customer-info">
                    <input type="text" id="nameInput" placeholder="Ваше имя" autocomplete="name">
                    <input type="tel" id="phoneInput" placeholder="Телефон" autocomplete="tel">
                    <textarea id="commentInput" placeholder="Комментарий к заказу (необязательно)" rows="2"></textarea>
                </div>
                <button class="checkout-btn" id="checkoutBtn">📦 Оформить заказ</button>
                <div class="cart-empty" id="cartEmpty">Корзина пуста</div>
            </div>
        </div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="app.js"></script>
</body>
</html>
